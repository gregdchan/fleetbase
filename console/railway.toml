# Railway configuration for the Fleetbase Console service.
# Scoped to the console rootDirectory; overrides the repo-root railway.toml
# (which configures the API service).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
